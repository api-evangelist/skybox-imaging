name: Skybox Imaging
description: Skybox Imaging was a high-resolution Earth-observation smallsat startup
  founded in 2009 out of Stanford University, building the SkySat constellation of
  small satellites to capture sub-meter commercial imagery and video. Backed by Canaan
  Partners among other venture investors, it was acquired by Google in 2014 for roughly
  $500M, renamed Terra Bella in 2016, and then sold to Planet Labs in 2017. The company
  no longer exists as an independent entity and publishes no live developer API, docs,
  or discovery surface; this profile is retained as a portfolio-graph node for
  canaan-partners.
